
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student | Next Gen Library</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">📚 Next Gen Library</div>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/books">Books</a>
            <a href="/students" class="active">Students</a>
            <a href="/borrow">Borrow Records</a>
        </nav>

        <div class="sidebar-footer">
            Library Management System
        </div>

    </aside>

    <main class="main">

        <header class="header">
            <div>
                <h1>Edit Student</h1>
                <p>Update registered student information.</p>
            </div>

            <a href="/students" class="cancel-button">
                ← Back to Students
            </a>
        </header>

        <section class="form-container">

            <h2>Student Details</h2>
            <p class="form-note">Update the details below.</p>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST"
                  action="{{ url_for('edit_student', enroll_id=student[0]) }}">

                <div class="form-grid">

                    <div>
                        <label>Enrollment ID</label>
                        <input type="text"
                               value="{{ student[0] }}"
                               readonly>
                    </div>

                    <div>
                        <label for="contact_no">Contact Number</label>
                        <input type="number"
                               id="contact_no"
                               name="contact_no"
                               value="{{ student[1] }}"
                               required>
                    </div>

                    <div>
                        <label for="user_id">User ID</label>
                        <input type="number"
                               id="user_id"
                               name="user_id"
                               value="{{ student[2] }}"
                               required>
                    </div>

                    <div>
                        <label for="dept_name">Department</label>
                        <input type="text"
                               id="dept_name"
                               name="dept_name"
                               value="{{ student[3] }}"
                               required>
                    </div>

                </div>

                <div class="form-actions">

                    <button type="submit" class="btn">
                        Update Student
                    </button>

                    <a href="/students" class="btn cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </section>

        <footer>
            © 2026 Next Gen Library Management System
        </footer>

    </main>

</body>
</html>
